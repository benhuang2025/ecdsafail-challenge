[package]
name = "fast-screen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fast-screen"
path = "src/main.rs"

[[bin]]
name = "sqcheck"
path = "src/bin/sqcheck.rs"

[dependencies]
quantum_ecc = { path = "../.." }
alloy-primitives = "1.5"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
